<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  
  <!-- Subtle ambient central glow -->
  <circle cx="32" cy="32" r="22" fill="url(#ambientGlow)"/>

  <!-- Left code bracket < -->
  <path d="M 18 24 L 9 32 L 18 40" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right code bracket > -->
  <path d="M 46 24 L 55 32 L 46 40" stroke="#c084fc" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stylized central 'S' -->
  <path d="M 39 23 C 36.8 20.8 34.2 19.8 31.5 19.8 C 26 19.8 23 22.8 23 26.8 C 23 32.8 40 31.8 40 37.8 C 40 42.4 36.2 44.2 31.5 44.2 C 27.5 44.2 24.2 42.6 22 40.2" 
        stroke="url(#neonGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
